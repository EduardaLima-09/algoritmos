<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05A - Exercicio 06</title>
</head>

<body>
    <h3>Aprovação Escolar: Notas e Frequência Fazem a Diferença!</h3>
    Nota do aluno: <input id="iptNota"> <br>
    Frequência do aluno: <input id="iptFrequencia"> <br>
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
<script>
    function avaliar() {
        var nota = Number(iptNota.value);
        var frequencia = Number(iptFrequencia.value);

        if (nota <= 0 || frequencia <= 0) {
            alert('Insira valores maiores que 0')
        } else {
            if (nota >= 6 && frequencia > 75) {
                alert('Parabéns! Aprovado!');
            } else {
                alert('Infelizmente, não foi desta vez');
            }
        }
    }
</script>

</html>
