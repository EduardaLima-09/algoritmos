<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05A - Exercicio 03</title>
</head>
<body>
    <h3>Validação de Notas: Seu Resultado é Aceitável?</h3>
    Nota do aluno: <input id="iptNota"> <br>
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
<script>
    function avaliar() {
        var nota = Number(iptNota.value);

        if (nota < 0 ) {
            alert('Entre com um valor maior que 0')
        } else {
            if (nota > 0 && nota <= 10) {
                alert('Nota válida!');
            } else {
                alert('Onde já se viu nota menor que 0 e maior que 10?!')
            }
        }
    }
</script>
</html>
