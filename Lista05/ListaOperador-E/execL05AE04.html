<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05A - Exercicio 04</title>
</head>
<body>
    <h3>Melhor Horário para Assistir Netflix: Evite Travamentos!</h3>
    Informar a hora do dia que você costuma acessar a Netflix (hrs): <input id="iptHora"> <br>
    <button onclick="recomendacao()">Ver recomendação</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    function recomendacao() {
        if (iptHora.value >= 19 && iptHora.value <= 21) {
            divMsg.innerHTML = 'Não é recomendável que você assista sua série favorita no horário ' + iptHora.value + ':00, !'
        } else {
            divMsg.innerHTML = 'O horário ' + iptHora.value + ':00,  é adequado para assistir sua série favorita!'
        }
    }
</script>
</html>
