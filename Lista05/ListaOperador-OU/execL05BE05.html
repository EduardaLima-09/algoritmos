<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05B - Exercicio 05</title>
</head>
<body>
    <h4>Alerta de Desconforto Térmico</h4>
    Temperatura atual: <input id="iptTemperaturaAtual"> <br>
    <button onclick="analisar()">Analisar o Clima</button>
</body>
<script>
    function analisar() {
        var temperatura = Number(iptTemperaturaAtual.value);

        if (temperatura < 21 ) {
            alert('Alerta de desconforto!, ' + 'as pessoas vão ter hipotermia');
        } else if (temperatura > 24) {
            alert('Alerta de desconforto!, ' + 'as pessoas vão derreter');
        }
    }
</script>
</html>
