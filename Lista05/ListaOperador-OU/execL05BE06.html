<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05B - Exercicio 06</title>
</head>
<body>
    <h4>Calculadora de Cansaço do Aluno SPTech</h4>
    Meio de transporte: 
    <select id="selTransporte">
        <option value="0">Selecione...</option>
        <option value="1">Ônibus</option>
        <option value="2">Metrô</option>
        <option value="3">Carro</option>
        <option value="4">Bicicleta</option>
        <option value="5">Uber</option>
    </select>
    <button onclick="calcular()">Calcular cansaço</button>
</body>
<script>
    function calcular() {
        var meioTransporte = Number(selTransporte);

        if (meioTransporte == 3 || meioTransporte == 5 ) {
            alert('Tá tranquilo...');
        } else if (meioTransporte == 2 || meioTransporte == 1) {
            alert('Um pouco cansado');
        } else if (meioTransporte == 4) {
            alert('Vish... vive cansado');
        }
    }
</script>
</html>
