<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05B - Exercicio 02</title>
</head>
<body>
    <h4>Processo Seletivo Mentes Brilhantes</h4>
    Solicite a nota do ENEM do aluno: <input id="iptNotaEnem"> <br>
    Solicite a nota do vestibular interno do aluno: <input id="iptNotaVestibular"> <br><br>
    <button onclick="avaliar()">Avaliação</button>
</body>
<script>
    function avaliar() {
        var notaEnem = Number(iptNotaEnem.value);
        var NotaVestibular = Number(iptNotaVestibular.value);

        if (notaEnem < 0 || notaEnem > 1000 || NotaVestibular < 0 || NotaVestibular > 1000 ) {
            alert('ERRO, insira notas válidas');
        } else if (notaEnem >= 800 && NotaVestibular >= 700) {
            alert('Parabéns, Aprovado!');
        } else {
            alert('Tente semestre que vem!');
        }
    }
</script>
</html>
