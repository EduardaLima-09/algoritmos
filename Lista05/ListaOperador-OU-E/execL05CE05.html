<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05C - Exercicio 05</title>
</head>

<body>
    <h4>Avaliação do Clima: Está Agradável ou Desconfortável?</h4>
    Temperatura: <input id="iptTemperatura"> <br>
    Umidade: <input id="iptUmidade"> <br><br>
    <button onclick="avaliar()">Avaliar clima</button>
    <div id="divMsg"></div>
</body>
<script>
    function avaliar() {
        var temperaturaAtual = Number(iptTemperatura.value)
        var umidadeAtual = Number(iptUmidade.value)

        if (umidadeAtual < 0 || umidadeAtual > 100) {
            alert('Valor de umidade inválido')
        } else {
            if (temperaturaAtual >= 22 && temperaturaAtual <= 23 && umidadeAtual < 60) {
                divMsg.innerHTML = 'Clima agradável'
            } else {
                divMsg.innerHTML = 'Clima desconfortável'
            }
        }
    }
</script>

</html>
