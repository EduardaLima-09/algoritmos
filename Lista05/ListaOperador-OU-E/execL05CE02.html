<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05C - Exercicio 02</title>
</head>
<body>
    <h4>Simulador de Preferências de Compras: Será que Robervaldo Gostaria?</h4>
    Tamanho da tela do celular: <input id="iptTamanhoTela"> <br>
    cor do celular: 
    <select id="sel_Cor">
        <option value="0">Selecione...</option>
        <option value="1">Preto</option>
        <option value="2">Prata</option>
        <option value="3">Azul</option>
        <option value="4">Vermelho</option>
    </select>
    <br>
    <button onclick="gostar()">Será que ele gosta?</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    function gostar() {
        var polegadas =  Number(iptTamanhoTela.value);
        var cor = sel_Cor.value;

        if (polegadas == 6.5 || cor == 1 || cor == 2) {
            divMsg.innerHTML = '<img src="Imagens/feliz.jpg" style="width: 20%;">'
        } else {
            divMsg.innerHTML = '<img src="Imagens/decepcionada.jpeg" style="width: 20%;">'
        }
    }
</script>
</html>
