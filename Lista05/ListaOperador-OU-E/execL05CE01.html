<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 05C - Exercicio 01</title>
</head>

<body>
    <h3>Sistema de Avaliação de Atendimento: Dê Sua Nota!</h3>
    Nota para o atendimento: <input id="iptNotaAtendimento"> <br>
    <button onclick="avaliar()">Avaliar atendimento</button>
</body>
<script>
    function avaliar() {
        var notaAtendimento = Number(iptNotaAtendimento.value);

        if (notaAtendimento < 0 || notaAtendimento > 10) {
            alert('Nota inválida');
        } else if (notaAtendimento >= 0 && notaAtendimento < 5) {
            alert('Não aprovado');
        } else if (notaAtendimento == 5 || notaAtendimento == 6) {
            alert('Neutro');
        } else {
            alert('Aprovado');
        } 
    }
</script>

</html>
