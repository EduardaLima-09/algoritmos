<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 09B - Exercicio 03</title>
</head>

<body>
    <h4>Registro de Linhas de Ônibus com Pesquisa de Histórico</h4>
    Nome da linha de ônibus: <input id="iptNomeLinha">
    <button onclick="gravar()">Gravar Busão</button>
    <hr>
    Pesquisar por linha: <input id="iptPesquisa">
    <button onclick="pesquisar()">Pesquisar</button>
    <hr>
    <div id="div_busao"></div>
</body>
<script>

    var vt_linha_bus = [];
    var mensagem = "";

    function gravar() {
        var linha = iptNomeLinha.value;
        vt_linha_bus.push(linha);
        alert('Busão gravado!');
        iptNomeLinha.value = '';

        mensagem = `<br><br>Linhas de Ônibus:<br><br>`;
        for (var index = vt_linha_bus.length - 1; index >= 0; index--) {
            mensagem += `A ${index + 1}ª: ${vt_linha_bus[index]}<br>`;
        }

        div_busao.innerHTML = mensagem;
    }

    function pesquisar() {
        var vezes = []; 
        var pesquisa = iptPesquisa.value;

        for (var index = 0; index < vt_linha_bus.length; index++) {
            if (vt_linha_bus[index].toLowerCase() == pesquisa.toLowerCase()) {
                vezes.push(index + 1);
            }
        }

        if (vezes.length == 0) {
            mensagem = `Você nunca pegou a linha ${pesquisa}.`;
        } else {
            mensagem = `Você já pegou essa linha ${vezes.length} vezes, nessa ordem: ${vezes.join(", ")}.`;
        }

        div_busao.innerHTML = mensagem;
    }
</script>

</html>
