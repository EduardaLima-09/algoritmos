<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 10A - Exercicio 01</title>
</head>
<body>
    <h4>Sortear</h4>
    <button onclick="sorteio()">Sortear</button> <br>
    <div id="div_msg"></div>
</body>
<script>
    function sorteio() {
        var ax_numeroAleatorio = Math.random();

        if (ax_numeroAleatorio > 0.5) {
            div_msg.innerHTML += `<br> Eu arredondaria para 1`;
        } else {
            div_msg.innerHTML += `<br> Eu arredondaria para 0`;
        }
    }
</script>
</html>
