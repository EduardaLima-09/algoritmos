<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 10A - Exercicio 02</title>
</head>

<body>
    <h4>Sortear Time</h4>
    <button onclick="sorteioTime()">Sortear Time</button> <br>
    <div id="div_msg"></div>
</body>
<script>
    function sorteioTime() {
        var ax_time = (Math.random() * 3 + 1).toFixed(0);

        if (ax_time == 1) {
            div_msg.innerHTML = `<br> <img src="times/Santos.png" width="150px">`;
        }
        if (ax_time == 2) {
            div_msg.innerHTML = `<br> <img src="times/Juventus.png" width="150px">`;
        }
        if (ax_time == 3) {
            div_msg.innerHTML = `<br> <img src="times/SaoPaulo.png" width="150px">`;
        }
        if (ax_time == 4) {
            div_msg.innerHTML = `<br> <img src="times/Corinthians.png" width="150px">`;
        }
    }
</script>

</html>
