<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06 - Exercicio 01</title>
</head>
<body>
    <h4>Contador de Caracteres</h4>
    Diga uma frase: <input id="iptFrase"> <br>
    <button onclick="analisar()">Analisar Frase</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    function analisar() {
        var axFrase = iptFrase.value;

        divMsg.innerHTML = `Tamanho da Frase: ${axFrase.length}`

        if (axFrase.length < 10) {
            divMsg.innerHTML += `<h4 style="color: red"> Frase Curta!`
        } else {
            divMsg.innerHTML += `<h4 style="color: blue"> Frase longa!`
        }

    }
</script>
</html>
