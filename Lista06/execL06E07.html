<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06 - Exercicio 07</title>
</head>
<body>
    <h4>Senha Forte ou Fraca</h4>
    Digite a senha: <input id="iptSenha" onkeyup="digitar()"> <br><br> 
    <div id="divMsg"></div>
</body>
<script>
    function digitar() {
        var senha = iptSenha.value;
        var criterio = 0;

        if (senha.Lentgh >= 8) {
            criterio++;
        }

        if (senha != senha.toLowerCase()) {
            criterio++;
        }

        if (senha != senha.toUpperCase()) {
            criterio++;
        }

        if (criterio == 3) {
            divMsg.innerHTML = 'Forte'
        } else if (criterio == 2) {
            divMsg.innerHTML = 'Média'
        } else if (criterio == 1) {
            divMsg.innerHTML = 'Fraca'
        } else {
            divMsg.innerHTML = 'Insegura'
        }

    }
</script>
</html>
