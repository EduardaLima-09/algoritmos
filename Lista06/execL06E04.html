<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06 - Exercicio 04</title>
</head>
<body>
    <h4>Comparador de Palavras</h4>
    1° Palavra: <input id="iptPrimeiraPalavra"> <br>
    2° Palavra: <input id="iptSegundaPalavra"> <br><br>
    <button onclick="analisar()">Analisar Palavras</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    function analisar() {
        var primeira = iptPrimeiraPalavra.value;
        var segunda = iptSegundaPalavra.value;

        if (primeira == segunda) {
            divMsg.innerHTML = 'As palavras ' + primeira + ' e  ' + segunda + ' são exatamente iguais!'
        } else if (primeira.toLowerCase() == segunda.toLowerCase()) {
            divMsg.innerHTML = 'As palavras ' + primeira + ' e ' + segunda + ' possuem o mesmo conteúdo, mas a digitação é diferente'
        } else {
            divMsg.innerHTML = 'As palavras ' + primeira + ' e ' + segunda + ' são completamente diferentes!'
        }
    }
</script>
</html>
