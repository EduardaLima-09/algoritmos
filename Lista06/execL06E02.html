<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06 - Exercicio 02</title>
</head>
<body>
    <h4> Detector de Palavras </h4>
    Diga uma frase: <input id="iptFrase"> <br>
    <button onclick="analisar()">Analisar Frase</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    function analisar() {
        axFrase =  iptFrase.value;

        if (axFrase.includes('teste') || axFrase.includes('abc') || axFrase.includes ('spam')) {
            divMsg.innerHTML = `<h3 style="color: red;"> Frase Inválida!`
        } else {
            divMsg.innerHTML = `<h3 style="color: green;"> Frase Válida!`
        }
    }
</script>
</html>
