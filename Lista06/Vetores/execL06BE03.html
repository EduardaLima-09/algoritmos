<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06B - Exercicio 03</title>
</head>
<body>
    <h4>Relembrando Moradias: Onde Você Já Viveu?</h4>
    Bairro onde já morou: <input id="iptBairro"> <br>
    <button onclick="cadastrar()">Cadastrar bairro</button> <br>
    Digite um número a partir de 1: <input id="iptNumero"> <br>
    <button onclick="relembrar()">Relembrar moradia</button> <br><br>
    <div id="divMsg"></div>
</body>
<script>
    
    var ax_Lugares = [];
    
    function cadastrar() {
        ax_Lugares.push(iptBairro.value);
        iptBairro.value = '';
    }

    function relembrar() {
        var numero = Number(iptNumero.value);

        if (numero == 1) {
            divMsg.innerHTML = `O primeiro bairro é: ${ax_Lugares[1]}<br>`
        } else if (numero == 2) {
            divMsg.innerHTML = `O segundo bairro é: ${ax_Lugares[2]} <br>`
        } else {
            divMsg.innerHTML = `Você ainda não morou ${numero} bairro!`
        }
    }
</script>
</html>
