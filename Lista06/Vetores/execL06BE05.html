<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 06B - Exercicio 05</title>
</head>
<body>
    <h4>Painel de Favoritos: Seus Filmes em Destaque</h4>
    Informe o nome dos filmes que mais gosta, começando pelo favorito: 
    <input id="iptFilmes"> <br>
    <button onclick="cadastrar()">Cadastrar filme</button>
    <div id="divMsg"></div>
</body>
<script>
    var ax_ListaFilmes = [];

    function cadastrar() {
        ax_ListaFilmes.push(iptFilmes.value);
        iptFilmes.value = '';

        divMsg.innerHTML = `Seu filme favorito: ${ax_ListaFilmes[0]}<br>
        Seu 3° filme favorito: ${ax_ListaFilmes[2]}<br>
        Total de filmes cadastrados: ${ax_ListaFilmes.length}`
    }
</script>
</html>
